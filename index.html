<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロール駆動計算</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--mut:#6b7785;--ac:#1f6feb;--bd:#d5dbe1}
@media (prefers-color-scheme:dark){:root{--bg:#161b22;--card:#1f2630;--tx:#e6edf3;--mut:#9aa7b4;--ac:#58a6ff;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--tx);font-family:"Meiryo","Hiragino Sans",sans-serif}
.wrap{max-width:860px;margin:auto}
h1{font-size:20px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--mut)}
label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:14px}
input{width:130px;padding:6px 8px;font-size:15px;text-align:right;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.u{width:48px;color:var(--mut);font-size:13px}
.r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.r:last-child{border:none}
.r b{font-size:18px;color:var(--ac)}
.f{font-size:12px;color:var(--mut);margin-top:2px}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:10px;font-size:14px;line-height:1.7;white-space:pre-wrap;margin:0 0 8px}
button{padding:7px 14px;border:none;border-radius:6px;background:var(--ac);color:#fff;font-size:13px;cursor:pointer}
.note{font-size:12px;color:var(--mut);margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<h1>ロール駆動計算(サーボモータ+ギアヘッド)</h1>
<div class="grid">
  <div class="card">
    <h2>入力</h2>
    <label>計算モード<select id="m" style="width:200px;padding:6px;font-size:14px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)">
      <option value="none">順算(ロール径→搬送速度)</option>
      <option value="d">搬送速度から ロール径 を逆算</option>
      <option value="i">搬送速度から 減速比 を逆算</option>
      <option value="n">搬送速度から モータ回転数 を逆算</option>
    </select></label>
    <label>搬送速度<span><input id="v" type="number" value="47" step="any"></span><span class="u">m/min</span></label>
    <label>サーボモータ出力<span><input id="p" type="number" value="200" step="any"></span><span class="u">W</span></label>
    <label>モータ回転数<span><input id="n" type="number" value="3000" step="any"></span><span class="u">rpm</span></label>
    <label>ギアヘッド減速比 1/<span><input id="i" type="number" value="20" step="any"></span><span class="u"></span></label>
    <label>ロール径<span><input id="d" type="number" value="100" step="any"></span><span class="u">mm</span></label>
    <label>伝達効率<span><input id="e" type="number" value="100" step="any"></span><span class="u">%</span></label>
    <div class="note">※逆算モードでは、搬送速度を入力すると選んだ項目(灰色の欄)が v = π·D·N ÷ (減速比·1000) から自動で求まります。<br>※ロール径の初期値φ100は、47m/min÷150rpmから逆算した値です。<br>※モータトルクは 出力÷角速度 で算出(定格運転を想定)。</div>
  </div>
  <div class="card">
    <h2>計算結果</h2>
    <div class="r"><span>モータトルク<div class="f">T = P ÷ (2π·N/60)</div></span><b id="o1"></b></div>
    <div class="r"><span>ロール回転数 MAX<div class="f">N ÷ 減速比</div></span><b id="o2"></b></div>
    <div class="r"><span>搬送速度 MAX<div class="f">π·D·n ÷ 1000</div></span><b id="o3"></b></div>
    <div class="r"><span>ロール駆動トルク<div class="f">T × 減速比 × 効率</div></span><b id="o4"></b></div>
    <div class="r"><span>張力換算<div class="f">トルク ÷ (D/2)</div></span><b id="o5"></b></div>
  </div>
</div>
<div class="card" style="margin-top:16px">
  <h2>図面記入用テキスト</h2>
  <pre id="txt"></pre>
  <button id="cp">コピー</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const f=(v,d)=>isFinite(v)?v.toFixed(d).replace(/\.0+$/,"").replace(/(\.\d*?)0+$/,"$1"):"-";
// 図面用:10以上は整数、1以上は小数1桁、1未満は小数2桁(0.1未満は3桁)。末尾の0は除去
const s=(x,min=0)=>{const a=Math.abs(x);if(!isFinite(x))return "-";
  const d=a>=10?0:a>=1?1:a>=0.1?2:3;return f(x,Math.max(d,min))};
function calc(){
  const m=$("m").value;
  const P=+$("p").value,E=(+$("e").value)/100,V=+$("v").value;
  let N=+$("n").value,I=+$("i").value,D=+$("d").value;
  // v = π·D·N/(I·1000) を解く
  if(m==="d")D=V*1000*I/(Math.PI*N);
  if(m==="i")I=Math.PI*D*N/(V*1000);
  if(m==="n")N=V*1000*I/(Math.PI*D);
  const tgt={d:["d",D,2],i:["i",I,3],n:["n",N,1]}[m];
  ["d","i","n","v"].forEach(k=>{$(k).readOnly=false;$(k).style.opacity=1});
  if(tgt){$(tgt[0]).value=isFinite(tgt[1])?+tgt[1].toFixed(tgt[2]):"";$(tgt[0]).readOnly=true;$(tgt[0]).style.opacity=.6}
  const Tm=P/(2*Math.PI*N/60);
  const n=N/I;
  const v=Math.PI*D*n/1000;
  if(m==="none"){$("v").value=isFinite(v)?+v.toFixed(2):"";$("v").readOnly=true;$("v").style.opacity=.6}
  const T=Tm*I*E;
  const F=T/(D/2000);
  $("o1").textContent=f(Tm,3)+" Nm";
  $("o2").textContent=f(n,1)+" rpm";
  $("o3").textContent=f(v,1)+" m/min";
  $("o4").textContent=f(T,1)+" Nm";
  $("o5").textContent=f(F,0)+" N ("+f(F/9.80665,1)+" kgf)";
  $("txt").textContent=
`サーボモータ ${s(P)}W×${s(N)}rpm
ギアヘッド 1/${s(I)}
ロール回転数 MAX.${s(n)}rpm
搬送速度 MAX.${s(v)}m/min
ロール駆動トルク ${s(T,1)}Nm
(張力換算 ${s(F)}N)`;
}
["p","n","i","d","e","v"].forEach(id=>$(id).addEventListener("input",calc));
$("m").addEventListener("change",calc);
$("cp").onclick=()=>{navigator.clipboard.writeText($("txt").textContent);$("cp").textContent="コピーしました";setTimeout(()=>$("cp").textContent="コピー",1200)};
calc();
</script>
</body>
</html>
